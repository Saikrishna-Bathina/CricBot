services:
  # 1. Express Backend Web Service
  - type: web
    name: cricbot-api
    runtime: node
    plan: starter
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/v1/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: LLM_PROVIDER
        value: gemini
      - key: LLM_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-1.5-flash
      - key: EMBEDDING_PROVIDER
        value: local
      - key: VECTOR_INDEX_NAME
        value: cricket_vector_index
      - key: USE_PYTHON_RAG
        value: "true"
      - key: PYTHON_RAG_SERVICE_URL
        fromService:
          type: web
          name: cricbot-rag
          property: host
      - key: PYTHON_RAG_TIMEOUT_MS
        value: 15000

  # 2. Python FastAPI RAG Microservice
  - type: web
    name: cricbot-rag
    runtime: python
    plan: starter
    rootDir: rag-service
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: LOG_LEVEL
        value: INFO
      - key: MONGODB_URI
        sync: false
      - key: MONGODB_DB_NAME
        value: cricket_laws
      - key: GEMINI_API_KEY
        sync: false
      - key: LLM_MODEL
        value: gemini-1.5-flash
      - key: EMBEDDING_PROVIDER
        value: local
      - key: VECTOR_INDEX_NAME
        value: cricket_vector_index
      - key: ALLOWED_ORIGINS
        value: "*"

  # 3. React Vite Static Site
  - type: static
    name: cricbot-client
    rootDir: client
    buildCommand: npm ci && npm run build
    staticPublishPath: dist
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        fromService:
          type: web
          name: cricbot-api
          property: url
          append: /api/v1
