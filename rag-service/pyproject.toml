[project]
name = "cricbot-rag-service"
version = "1.0.0"
description = "High-precision Cricket Law RAG microservice with PyMuPDF, hybrid search, and claim-level verification"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn>=0.30.0",
    "pydantic>=2.8.0",
    "pydantic-settings>=2.4.0",
    "motor>=3.5.0",
    "pymongo>=4.8.0",
    "httpx>=0.27.0",
    "pymupdf>=1.24.0",
    "python-dotenv>=1.0.0",
    "google-genai>=0.1.0",
]

[build-system]
requires = ["setuptools"]
build-backend = "setuptools.build_meta"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = "test_*.py"
